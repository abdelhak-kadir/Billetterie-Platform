services:
  app:
    build:
      context: .
      args:
        UID: ${HOST_UID:-${UID:-1000}}
        GID: ${HOST_GID:-${GID:-1000}}
    image: ${COMPOSE_PROJECT_NAME:-billetterie-platform}-app
    init: true
    working_dir: /app
    labels:
      dev.horizon.demo-program: "2"
    environment:
      HORIZON_AUTO_DEMO: ${HORIZON_AUTO_DEMO:-1}
    command: [sh, bin/start-docker]
    healthcheck:
      test: ["CMD", "php", "-r", "$$headers = @get_headers('http://127.0.0.1:8000/'); exit($$headers && str_contains($$headers[0], '200') ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      start_period: 600s
      retries: 6
    volumes:
      - .:/app
      - composer-cache:/home/app/.composer/cache
    ports:
      - "${HORIZON_HTTP_PORT:-8080}:8000"
    depends_on:
      database:
        condition: service_healthy

  sheets-worker:
    profiles: [sheets]
    image: ${COMPOSE_PROJECT_NAME:-billetterie-platform}-app
    init: true
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      app:
        condition: service_healthy
      database:
        condition: service_healthy
    command: [php, bin/console, app:sheets:sync, --watch, --enqueue-existing]

  database:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-billetterie}
      MYSQL_USER: ${MYSQL_USER:-billetterie}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-billetterie}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -u \"$${MYSQL_USER}\" \"$${MYSQL_DATABASE}\" -e 'SELECT 1' >/dev/null"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - database-data:/var/lib/mysql

volumes:
  composer-cache:
  database-data:
