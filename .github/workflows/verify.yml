name: Horizon - clean Docker installation
on:
  push:
    branches: [main, sprint-5-livraison, sprint-4-google-sheets]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: horizon-ci
      HORIZON_HTTP_PORT: '8080'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Compose startup and persistent demo purchase
        run: |
          docker compose up --build -d --wait
          docker compose exec -T app php bin/console dbal:run-sql 'SELECT DATABASE() AS demo_database'
          python3 tests/Support/demo-http-check.py --base-url http://localhost:8080
          docker compose up --build -d --wait --force-recreate
          python3 tests/Support/demo-http-check.py --base-url http://localhost:8080 --expect-existing
          ./bin/setup-demo
      - name: Chromium desktop and mobile journeys
        run: |
          python3 -m pip install --requirement tests/browser-requirements.txt
          python3 -m playwright install --with-deps chromium
          python3 tests/Support/demo-browser-check.py --output-dir /tmp/horizon-browser-qa
      - name: Browser screenshots
        uses: actions/upload-artifact@v7.0.2
        with:
          name: horizon-browser-qa
          path: /tmp/horizon-browser-qa/*.png
          retention-days: 14
      - name: MySQL tests and isolated fixtures
        run: ./bin/test-docker
      - name: Preserve volumes across restart
        run: |
          docker compose down
          docker compose up -d --wait app database
          curl --fail --silent --retry 10 --retry-connrefused --retry-delay 1 http://localhost:8080/ > /dev/null
      - name: Docker logs on failure
        if: failure()
        run: docker compose logs --tail=80
      - name: Remove this job's disposable volumes
        if: always()
        run: docker compose down --volumes
